name: Auto Update Balancers

on:
  schedule:
    - cron: "0 * * * *" # Запуск каждый час (в 00 минут каждого часа)
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой "Run workflow"

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate subscription file
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.txt
          git commit -m "Auto-update proxy balancers" || exit 0
          git push
